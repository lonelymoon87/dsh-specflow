name: Bug or compatibility report
description: Report behavior that can be reproduced with dsh-specflow.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing SpecFlow. Remove credentials, private source, and unredacted logs before submitting.
  - type: input
    id: specflow-version
    attributes:
      label: SpecFlow version
      placeholder: 0.1.3
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.1.1-rc.1
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options:
        - web
        - headless
        - custom
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the commands, relevant artifact state, and the smallest repository setup needed to reproduce the behavior.
      placeholder: |
        1. Install ...
        2. Run /specflow ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted diagnostics
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private source, personal data, and unredacted logs.
          required: true
